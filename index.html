<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATIVE.VOD | 視覺敘事作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-purple: #9333ea; --p-light: #a855f7; --bg: #050505; --gray: #888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        body { background: var(--bg); color: white; scroll-behavior: smooth; overflow-x: hidden; }

        /* --- 0. 開場動畫 (相機 UI) --- */
        #intro-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1s ease-out;
        }
        #intro-loader.fade-out { opacity: 0; pointer-events: none; }
        .camera-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 30px; display: flex; flex-direction: column;
            justify-content: space-between; pointer-events: none;
        }
        .rec-status { color: #fff; font-family: monospace; font-size: 1rem; }
        .rec-status span { color: #ff0000; animation: blink 1s steps(2, start) infinite; }
        #timer { font-family: monospace; align-self: flex-end; color: var(--p-purple); }
        @keyframes blink { to { visibility: hidden; } }

        /* --- 1. Hero 背景動態 (讓黑色變豐富的關鍵) --- */
        .hero { 
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
            position: relative; overflow: hidden;
        }
        /* 背景流動光暈 */
        .hero-bg-glow {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: -1;
        }
        .glow-1, .glow-2 {
            position: absolute; width: 600px; height: 600px; 
            border-radius: 50%; filter: blur(120px); opacity: 0.15;
            animation: moveGlow 15s infinite alternate;
        }
        .glow-1 { background: var(--p-purple); top: -10%; left: -10%; }
        .glow-2 { background: #3b82f6; bottom: -10%; right: -10%; animation-delay: -5s; }
        
        @keyframes moveGlow {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(20%, 30%) scale(1.2); }
        }

        /* --- 2. 導航欄 --- */
        nav { 
            position: fixed; top: 0; width: 100%; display: flex; 
            justify-content: space-between; align-items: center; 
            padding: 1.5rem 5%; z-index: 1000; 
            background: rgba(5,5,5,0.7); backdrop-filter: blur(15px); 
        }
        .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { text-decoration: none; color: white; font-size: 0.9rem; font-weight: bold; transition: 0.3s; }
        .nav-links a:hover { color: var(--p-purple); }

        /* --- 3. 文字與按鈕 --- */
        .hero h1 { 
            font-size: clamp(2.5rem, 10vw, 4.5rem); font-weight: 900; line-height: 1.1; 
            margin-bottom: 2.5rem; animation: textFadeUp 1.5s ease-out;
        }
        .hero h1 span { color: var(--p-purple); text-shadow: 0 0 30px rgba(147, 51, 234, 0.4); }
        
        @keyframes textFadeUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .cta-btn {
            background: var(--p-purple); color: white; padding: 18px 45px; 
            border-radius: 50px; text-decoration: none; font-weight: 900;
            transition: 0.3s; box-shadow: 0 10px 30px rgba(147, 51, 234, 0.3);
        }
        .cta-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(147, 51, 234, 0.5); }

        /* --- 4. 作品集區域 (修復影片報錯與手機佈局) --- */
        .portfolio-section { padding: 100px 5%; background: #080808; }
        .video-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; 
        }
        .video-card { 
            position: relative; border-radius: 20px; overflow: hidden; 
            aspect-ratio: 9/16; background: #111; border: 1px solid #222;
        }
        .video-card iframe { width: 100%; height: 100%; border: none; }

        @media (max-width: 768px) {
            .nav-links { display: none; } /* 手機隱藏選單，建議加漢堡選單或簡化 */
            .video-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div id="intro-loader">
        <div class="camera-ui">
            <div class="rec-status"><span>●</span> REC</div>
            <div id="timer">00:00:00:00</div>
        </div>
        <div style="font-size: 2rem; font-weight: 900; letter-spacing: 5px;">CREATIVE.VOD</div>
    </div>

    <nav>
        <div class="logo">CREATIVE.VOD</div>
        <ul class="nav-links">
            <li><a href="#portfolio">作品集</a></li>
            <li><a href="#about">關於</a></li>
            <li><a href="#contact">聯繫</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="hero-bg-glow">
            <div class="glow-1"></div>
            <div class="glow-2"></div>
        </div>

        <p style="letter-spacing: 5px; color: #666; font-weight: bold; margin-bottom: 1rem;">VISUAL STORYTELLER</p>
        <h1>捕捉瞬間的<br><span>動態美學</span></h1>
        <a href="#portfolio" class="cta-btn">查看作品集 →</a>
    </section>

    <section id="portfolio" class="portfolio-section">
        <div class="video-grid">
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/va_5q5G1aCc?mute=1&loop=1&playlist=va_5q5G1aCc" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/QVZGOJE3aHE?mute=1&loop=1&playlist=QVZGOJE3aHE" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/JqDsD-AV1ZE?mute=1&loop=1&playlist=JqDsD-AV1ZE" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 時間碼動畫
            const timer = document.getElementById('timer');
            let frames = 0;
            function updateTimer() {
                frames++;
                const secs = Math.floor(frames / 60).toString().padStart(2, '0');
                const ms = (frames % 60).toString().padStart(2, '0');
                timer.innerText = `00:00:${secs}:${ms}`;
                requestAnimationFrame(updateTimer);
            }
            updateTimer();

            // 2. 移除 Loader
            setTimeout(() => {
                document.getElementById('intro-loader').classList.add('fade-out');
            }, 2500);

            // 3. 平滑捲動 (解決您提到的導航欄點選問題)
            document.querySelectorAll('nav a').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelector(this.getAttribute('href')).scrollIntoView({
                        behavior: 'smooth'
                    });
                });
            });
        });
    </script>
</body>
</html>
