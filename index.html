<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREATIVE.VOD | 視覺敘事作品集</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-purple: #9333ea; --p-light: #a855f7; --bg: #050505; --gray: #888;
            --text-dark: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Noto Sans TC', sans-serif; }
        body { background: var(--bg); color: white; scroll-behavior: smooth; overflow-x: hidden; width: 100%; }

        /* --- 0. 開場動畫 --- */
        #intro-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: opacity 1s ease-out;
        }
        #intro-loader.fade-out { opacity: 0; pointer-events: none; }
        .camera-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 30px; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none;
        }
        .rec-status { color: #fff; font-family: monospace; }
        .rec-status span { color: #ff0000; animation: blink 1s steps(2, start) infinite; }
        #timer { font-family: monospace; align-self: flex-end; color: var(--p-purple); }
        @keyframes blink { to { visibility: hidden; } }

        /* --- 1. Hero 背景特效 --- */
        .hero { 
            height: 100vh; display: flex; flex-direction: column; justify-content: center; 
            align-items: center; text-align: center; position: relative; overflow: hidden;
        }
        /* 粒子與光暈容器 */
        #hero-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .hero-content { z-index: 2; position: relative; padding: 0 5%; }

        .hero h1 { font-size: clamp(2.5rem, 10vw, 4.5rem); font-weight: 900; line-height: 1.1; margin: 1.5rem 0 2.5rem; }
        .hero h1 span { color: var(--p-purple); text-shadow: 0 0 30px rgba(147, 51, 234, 0.4); }

        /* --- 2. 導航欄 --- */
        nav { 
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; 
            align-items: center; padding: 1.2rem 5%; z-index: 1000; 
            background: rgba(5,5,5,0.8); backdrop-filter: blur(15px); 
        }
        .logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; cursor: pointer; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { text-decoration: none; color: white; font-size: 0.9rem; font-weight: bold; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--p-purple); }

        /* --- 3. 作品集 (8個影片預留) --- */
        .portfolio-section { padding: 100px 5%; background: #080808; scroll-margin-top: 80px; }
        .portfolio-header { text-align: center; margin-bottom: 50px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .video-card { 
            position: relative; border-radius: 20px; overflow: hidden; 
            aspect-ratio: 9/16; background: #151515; border: 1px solid #222;
        }
        .video-card iframe { width: 100%; height: 100%; border: none; }

        /* --- 4. 關於 & 聯繫 (補回消失區塊) --- */
        .about { padding: 100px 5%; display: flex; align-items: center; gap: 60px; flex-wrap: wrap; scroll-margin-top: 80px; }
        .about-img { flex: 1; min-width: 320px; border-radius: 24px; overflow: hidden; }
        .about-img img { width: 100%; filter: grayscale(1); transition: 0.5s; }
        .about-text { flex: 1.2; min-width: 320px; }
        .about-text h2 { font-size: 3rem; margin-bottom: 20px; }
        
        .contact { padding: 100px 5%; background: white; color: #000; text-align: center; scroll-margin-top: 80px; }
        .f-container { max-width: 600px; margin: 40px auto 0; text-align: left; }
        .f-group { border-bottom: 1px solid #ddd; padding: 15px 0; margin-bottom: 20px; }
        .f-group label { font-size: 0.7rem; font-weight: 900; color: #999; }
        .f-group input { width: 100%; border: none; padding: 10px 0; outline: none; font-size: 1rem; }
        .btn-send { background: black; color: white; padding: 15px 50px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .video-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="intro-loader">
        <div class="camera-ui">
            <div class="rec-status"><span>●</span> REC</div>
            <div id="timer">00:00:00:00</div>
        </div>
        <h2 style="letter-spacing: 5px;">CREATIVE.VOD</h2>
    </div>

    <nav>
        <div class="logo" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">CREATIVE.VOD</div>
        <ul class="nav-links">
            <li><a href="#hero">首頁</a></li>
            <li><a href="#portfolio">作品集</a></li>
            <li><a href="#about">關於我</a></li>
            <li><a href="#contact">聯繫洽談</a></li>
        </ul>
    </nav>

    <section id="hero" class="hero">
        <canvas id="hero-canvas"></canvas>
        <div class="hero-content">
            <p style="letter-spacing: 5px; color: #666; font-weight: bold;">VISUAL STORYTELLER</p>
            <h1>捕捉瞬間的<br><span>動態美學</span></h1>
            <a href="#portfolio" class="btn-send" style="text-decoration: none;">START EXPLORING</a>
        </div>
    </section>

    <section id="portfolio" class="portfolio-section">
        <div class="portfolio-header"><h2>PORTFOLIO</h2></div>
        <div class="video-grid">
            <div class="video-card"><iframe src="https://www.youtube.com/embed/va_5q5G1aCc?mute=1&loop=1&playlist=va_5q5G1aCc" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
            <div class="video-card"><iframe src="https://www.youtube.com/embed/QVZGOJE3aHE?mute=1&loop=1&playlist=QVZGOJE3aHE" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
            <div class="video-card"><iframe src="https://www.youtube.com/embed/JqDsD-AV1ZE?mute=1&loop=1&playlist=JqDsD-AV1ZE" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
            <div class="video-card"><iframe src="https://www.youtube.com/embed/u3j0kzHBp2E?mute=1&loop=1&playlist=u3j0kzHBp2E" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
            <div class="video-card"><iframe src="https://www.youtube.com/embed/_s45Tu-BpRY?mute=1&loop=1&playlist=_s45Tu-BpRY" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
            <div class="video-card"><iframe src="https://www.youtube.com/embed/CkKldNNRiL0?mute=1&loop=1&playlist=CkKldNNRiL0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
            <div class="video-card"><div style="color:#333; display:flex; height:100%; align-items:center; justify-content:center;">COMING SOON 07</div></div>
            <div class="video-card"><div style="color:#333; display:flex; height:100%; align-items:center; justify-content:center;">COMING SOON 08</div></div>
        </div>
    </section>

    <section id="about" class="about">
        <div class="about-img"><img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=800"></div>
        <div class="about-text">
            <h2>視覺背後的靈魂</h2>
            <p style="color:var(--gray); line-height:1.8;">致力於將影像轉化為情感與故事，為品牌打造專屬的動態語言...</p>
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>CONTACT ME</h2>
        <div class="f-container">
            <div class="f-group"><label>NAME</label><input type="text"></div>
            <div class="f-group"><label>EMAIL</label><input type="email"></div>
            <button class="btn-send">SEND MESSAGE</button>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. 背景粒子特效
            const canvas = document.getElementById('hero-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2 + 0.1;
                    this.speedX = Math.random() * 0.5 - 0.25;
                    this.speedY = Math.random() * 0.5 - 0.25;
                    this.alpha = Math.random() * 0.5;
                }
                update() {
                    this.x += this.speedX; this.y += this.speedY;
                    if (this.x > canvas.width) this.x = 0; if (this.x < 0) this.x = canvas.width;
                    if (this.y > canvas.height) this.y = 0; if (this.y < 0) this.y = canvas.height;
                }
                draw() {
                    ctx.fillStyle = `rgba(147, 51, 234, ${this.alpha})`;
                    ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                }
            }
            for (let i = 0; i < 100; i++) particles.push(new Particle());
            function animate() {
                ctx.clearRect(0,0,canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();

            // 2. 導航跳轉修正
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
                });
            });

            // 3. Loader & Timer
            setTimeout(() => { document.getElementById('intro-loader').classList.add('fade-out'); }, 2000);
            const timer = document.getElementById('timer');
            let f = 0;
            function runT() { f++; timer.innerText = `00:00:00:${(f%60).toString().padStart(2,'0')}`; requestAnimationFrame(runT); }
            runT();
        });
    </script>
</body>
</html>
